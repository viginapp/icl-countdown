<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InApp Champions League — Season 2 Countdown</title>
<!-- Link preview (replace the domain once hosted) -->
<meta property="og:title" content="InApp Champions League · Season 2">
<meta property="og:description" content="Live countdown to the first ball — 11 September, Oval Turf, Thiruvananthapuram">
<meta property="og:type" content="website">
<meta property="og:url" content="https://YOUR-USERNAME.github.io/icl-countdown/">
<meta property="og:image" content="https://YOUR-USERNAME.github.io/icl-countdown/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="629">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#C8102E">
<style>
  :root{
    --yellow:#F7F52A;
    --gold:#F3B21B;
    --white:#FFFFFF;
    --red:#C8102E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#7A0A16;font-family:"Segoe UI","Trebuchet MS",Arial,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}

  /* 9:16 poster canvas — scales to whatever screen it's on */
  .poster{
    position:relative;
    aspect-ratio:9/16;
    height:100vh;
    max-width:100vw;
    background:url("poster.jpg") center/cover no-repeat;
    container-type:size;
    overflow:hidden;
  }
  /* covers the static "10 / Days to Go" band from the original artwork */
  .mask{
    position:absolute;left:0;right:0;
    top:36.5%;height:32%;
    backdrop-filter:blur(28px) saturate(1.1);
    -webkit-backdrop-filter:blur(28px) saturate(1.1);
    background:linear-gradient(180deg,rgba(200,16,46,0) 0%,rgba(200,16,46,.55) 12%,rgba(200,16,46,.55) 88%,rgba(200,16,46,0) 100%);
  }
  .count{
    position:absolute;left:0;right:0;top:37.5%;
    display:flex;flex-direction:column;align-items:center;
    color:var(--white);text-align:center;
  }
  .days{
    color:var(--yellow);
    font-weight:800;
    font-size:26cqw;
    line-height:.9;
    letter-spacing:-.02em;
    text-shadow:0 .6cqw 0 rgba(0,0,0,.28);
    font-variant-numeric:tabular-nums;
  }
  .days-label{
    font-size:5.4cqw;font-weight:600;margin-top:1cqw;
    text-shadow:0 .3cqw 0 rgba(0,0,0,.3);
  }
  .hms{
    display:flex;align-items:flex-start;gap:0;margin-top:3.2cqw;
  }
  .unit{display:flex;flex-direction:column;align-items:center;min-width:16cqw}
  .unit b{
    font-size:11cqw;font-weight:800;line-height:1;
    color:var(--yellow);
    font-variant-numeric:tabular-nums;
    text-shadow:0 .45cqw 0 rgba(0,0,0,.28);
  }
  .unit span{font-size:3cqw;font-weight:600;margin-top:.8cqw;opacity:.95}
  .colon{
    font-size:11cqw;font-weight:800;line-height:1;color:var(--gold);
    padding:0 .8cqw;
    animation:tick 1s steps(1,end) infinite;
  }
  @keyframes tick{50%{opacity:.25}}
  .until{
    margin-top:3cqw;font-size:3.1cqw;font-weight:500;opacity:.9;
    text-shadow:0 .2cqw 0 rgba(0,0,0,.3);
  }
  .live{
    font-size:9cqw;font-weight:800;color:var(--yellow);
    letter-spacing:.04em;text-shadow:0 .5cqw 0 rgba(0,0,0,.3);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{50%{transform:scale(1.05)}}
  @media (prefers-reduced-motion:reduce){.colon,.live{animation:none}}
</style>
</head>
<body>
<div class="poster">
  <div class="count" id="count" aria-live="polite">
    <div class="days" id="d">--</div>
    <div class="days-label" id="dlabel">Days to Go</div>
    <div class="hms">
      <div class="unit"><b id="h">--</b><span>Hours</span></div>
      <div class="colon">:</div>
      <div class="unit"><b id="m">--</b><span>Minutes</span></div>
      <div class="colon">:</div>
      <div class="unit"><b id="s">--</b><span>Seconds</span></div>
    </div>
    <div class="until">Until first ball — 11 Sep 2026, 2:00 PM IST</div>
  </div>
</div>
<script>
  // ── Change the target here if the start time differs ──
  const TARGET = new Date("2026-09-11T14:00:00+05:30");

  const pad = n => String(n).padStart(2,"0");
  const el = id => document.getElementById(id);

  function render(){
    let diff = TARGET - Date.now();
    if (diff <= 0){
      el("count").innerHTML =
        '<div class="live">MATCH DAY</div>' +
        '<div class="days-label">The league is live at Oval Turf</div>';
      clearInterval(timer);
      return;
    }
    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor(diff % 86400000 / 3600000);
    const mins  = Math.floor(diff % 3600000 / 60000);
    const secs  = Math.floor(diff % 60000 / 1000);

    el("d").textContent = days;
    el("dlabel").textContent = days === 1 ? "Day to Go" : "Days to Go";
    el("h").textContent = pad(hours);
    el("m").textContent = pad(mins);
    el("s").textContent = pad(secs);
  }
  render();
  const timer = setInterval(render, 1000);
</script>
</body>
</html>
