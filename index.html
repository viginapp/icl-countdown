<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InApp Champions League — Season 2 Countdown</title>
<meta property="og:title" content="InApp Champions League · Season 2">
<meta property="og:description" content="Live countdown to the first ball — 11 September, Oval Turf, Thiruvananthapuram">
<meta property="og:type" content="website">
<meta property="og:url" content="https://viginapp.github.io/icl-countdown/">
<meta property="og:image" content="https://viginapp.github.io/icl-countdown/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="629">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#AE1412">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#AE1412;
    --red-deep:#7E0C0C;
    --navy:#0E1733;
    --cream:#EDE9E4;
    --gold:#F1AA03;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1a1a1a;overflow:hidden;
    font-family:"Oswald","Segoe UI",Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;min-height:100dvh}

  .poster{
    position:relative;
    aspect-ratio:9/16;
    width:min(100vw, calc(100vh * 9 / 16));   /* fallback for older browsers */
    width:min(100vw, calc(100dvh * 9 / 16));
    height:auto;
    background:url("poster.jpg") center/cover no-repeat;
    container-type:inline-size;
    overflow:hidden;
  }
  .count{
    position:absolute;left:0;right:0;top:33%;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;
  }

  /* the big day number — heavy, red, tilted like the brush lettering */
  .days{
    font-family:"Anton","Impact",sans-serif;
    font-size:40cqw;line-height:.85;
    color:var(--red);
    transform:skewX(-8deg) rotate(-3deg);
    letter-spacing:-.01em;
    text-shadow:
      0 .6cqw 0 var(--red-deep),
      0 0 1.4cqw rgba(174,20,18,.25);
    font-variant-numeric:tabular-nums;
  }

  /* navy brush band with script text */
  .band{
    margin-top:-2.5cqw;
    padding:1.6cqw 8cqw 2.2cqw;
    background:var(--navy);
    color:#fff;
    font-family:"Kaushan Script",cursive;
    font-size:9.5cqw;line-height:1;
    transform:rotate(-3.5deg);
    clip-path:polygon(2% 12%,10% 0,42% 6%,70% 0,97% 10%,100% 40%,98% 88%,88% 100%,60% 92%,25% 100%,3% 90%,0 55%);
    box-shadow:0 .8cqw 0 rgba(14,23,51,.18);
  }

  .hms{
    display:flex;align-items:flex-start;margin-top:4.5cqw;
  }
  .unit{display:flex;flex-direction:column;align-items:center;min-width:15cqw}
  .unit b{
    font-family:"Anton","Impact",sans-serif;font-weight:400;
    font-size:9.5cqw;line-height:1;color:var(--red);
    font-variant-numeric:tabular-nums;
    transform:skewX(-6deg);
  }
  .unit span{
    font-size:2.5cqw;font-weight:600;letter-spacing:.28em;
    color:var(--navy);margin-top:1.2cqw;text-transform:uppercase;
  }
  .colon{
    font-family:"Anton",sans-serif;font-size:9.5cqw;line-height:1;
    color:var(--navy);padding:0 .6cqw;
    animation:tick 1s steps(1,end) infinite;
  }
  @keyframes tick{50%{opacity:.2}}

  .live{
    font-family:"Anton","Impact",sans-serif;
    font-size:18cqw;line-height:.9;color:var(--red);
    transform:skewX(-8deg) rotate(-3deg);
    text-shadow:0 .6cqw 0 var(--red-deep);
    animation:pulse 1.6s ease-in-out infinite;
  }
  .live-sub{
    margin-top:3cqw;font-size:3.4cqw;font-weight:600;letter-spacing:.25em;
    color:var(--navy);text-transform:uppercase;
  }
  @keyframes pulse{50%{transform:skewX(-8deg) rotate(-3deg) scale(1.04)}}
  @media (prefers-reduced-motion:reduce){.colon,.live{animation:none}}
</style>
</head>
<body>
<div class="poster">
  <div class="count" id="count" aria-live="polite">
    <div class="days" id="d">--</div>
    <div class="band" id="dlabel">Days to Go</div>
    <div class="hms">
      <div class="unit"><b id="h">--</b><span>Hours</span></div>
      <div class="colon">:</div>
      <div class="unit"><b id="m">--</b><span>Minutes</span></div>
      <div class="colon">:</div>
      <div class="unit"><b id="s">--</b><span>Seconds</span></div>
    </div>
  </div>
</div>
<script>
  // ── Change the target here if the start time differs ──
  const TARGET = new Date("2026-09-11T14:00:00+05:30");

  const pad = n => String(n).padStart(2,"0");
  const el = id => document.getElementById(id);

  function render(){
    const diff = TARGET - Date.now();
    if (diff <= 0){
      el("count").innerHTML =
        '<div class="live">MATCH DAY</div>' +
        '<div class="live-sub">Let the game begin</div>';
      clearInterval(timer);
      return;
    }
    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor(diff % 86400000 / 3600000);
    const mins  = Math.floor(diff % 3600000 / 60000);
    const secs  = Math.floor(diff % 60000 / 1000);

    el("d").textContent = days;
    el("dlabel").textContent = days === 1 ? "Day to Go" : "Days to Go";
    el("h").textContent = pad(hours);
    el("m").textContent = pad(mins);
    el("s").textContent = pad(secs);
  }
  render();
  const timer = setInterval(render, 1000);
</script>
</body>
</html>
